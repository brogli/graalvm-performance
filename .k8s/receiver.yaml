apiVersion: v1
kind: Pod
metadata:
  name: receiver-pod-jvm
  labels:
    app: receiver
spec:
  containers:
    - name: receiver
      image: graalvm-performance/receiver:latest
      ports:
        - containerPort: 8082
          hostPort: 8082
      resources:
        limits:
          memory: "256Mi"
        requests:
          memory: "64Mi"
      env:
        - name: SERVER_PORT
          value: "8082"