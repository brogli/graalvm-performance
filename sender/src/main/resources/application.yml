spring:
  application:
    name: sender
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          pingClient:
            url: ${APP_RECEIVER_URL:http://localhost:8082}

server:
  port: 8081


management:
  endpoints:
    web:
      cors:
        allowed-origins: "*"
      exposure:
        include: "health,info,prometheus,metrics"

