apiVersion: v1
kind: Pod
metadata:
  name: sender-pod-graalvm
  labels:
    app: sender
spec:
  containers:
    - name: sender
      image: docker.io/graalvm-performance/sender-graalvm:latest
      ports:
        - containerPort: 8081
          hostPort: 8081
      resources:
        limits:
          memory: "64Mi"
        requests:
          memory: "32Mi"
      env:
        - name: SERVER_PORT
          value: "8081"
        - name: APP_RECEIVER_URL
          value: "http://receiver:8082"
