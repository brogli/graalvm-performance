apiVersion: v1
kind: Pod
metadata:
  name: receiver-pod
  labels:
    app: receiver
spec:
  containers:
    - name: receiver
      image: localhost/graalvm-performance/receiver:latest
      ports:
        - containerPort: 8080
          hostPort: 8080
      resources:
        limits:
          memory: "768Mi"
        requests:
          memory: "512Mi"
      env:
        - name: SERVER_PORT
          value: "8080"