apiVersion: v1
kind: Pod
metadata:
  name: sender-pod
  labels:
    app: sender
spec:
  containers:
    - name: sender
      image: localhost/graalvm-performance/sender:latest
      ports:
        - containerPort: 8081
          hostPort: 8081
      resources:
        limits:
          memory: "768Mi"
        requests:
          memory: "512Mi"
      env:
        - name: SERVER_PORT
          value: "8081"
        - name: RECEIVER_URL
          value: "http://receiver:8082"
