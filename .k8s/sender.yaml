apiVersion: v1
kind: Pod
metadata:
  name: sender-pod-jvm
  labels:
    app: sender
spec:
  containers:
    - name: sender
      image: graalvm-performance/sender:latest
      ports:
        - containerPort: 8081
          hostPort: 8081
      resources:
        limits:
          memory: "256Mi"
        requests:
          memory: "64Mi"
      env:
        - name: SERVER_PORT
          value: "8081"
        - name: APP_RECEIVER_URL
          value: "http://receiver:8082"
