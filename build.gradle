plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
//	id 'org.graalvm.buildtools.native' version '0.10.6' apply false
    id 'com.google.cloud.tools.jib' version '3.4.5' apply false

}

group = 'ch.brogli'
version = '0.0.1-SNAPSHOT'
description = 'Showcasing GraalVM performance'

subprojects {
	apply plugin: 'java'

	group = rootProject.group
	version = rootProject.version

	repositories {
		mavenCentral()
	}

	// Apply Spring Boot and dependency management to Spring Boot app modules
	if (project.name in ['sender', 'receiver']) {
		apply plugin: 'org.springframework.boot'
		apply plugin: 'io.spring.dependency-management'
//		apply plugin: 'org.graalvm.buildtools.native'
        apply plugin: 'com.google.cloud.tools.jib'

		dependencyManagement {
			imports {
				mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"
			}
		}

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        configurations {
            compileOnly {
                extendsFrom annotationProcessor
            }
        }

        dependencies {
            implementation project(':shared')
            implementation 'org.springframework.boot:spring-boot-starter-web'
            implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
            implementation 'org.springframework.boot:spring-boot-starter-actuator'
            implementation 'io.micrometer:micrometer-registry-prometheus:1.15.5'
            compileOnly 'org.projectlombok:lombok'
            annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
            annotationProcessor 'org.projectlombok:lombok'
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }

        tasks.named('test') {
            useJUnitPlatform()
        }

        jib {
            from {
                image = 'eclipse-temurin:21-jre'
            }
            to {
                image = "graalvm-performance/${project.name}"
                tags = [project.version, 'latest']
            }
            container {
                // graalvm: remove jvmFlags
                jvmFlags = [
                        '-XX:MaxRAMPercentage=75.0',
                        '-XX:InitialRAMPercentage=50.0'
                ]
                ports = [project.name == 'sender' ? '8081' : '8082']
                creationTime = 'USE_CURRENT_TIMESTAMP'
            }
        }
	}
}
